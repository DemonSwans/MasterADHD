name: Zbuduj i Opublikuj APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Instalacja Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalacja Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalacja bibliotek
        run: |
          pip install flet pytest

      - name: Uruchom testy (pytest)
        run: pytest test_app.py -v

      - name: Budowanie APK (Ominięcie pytania)
        run: yes | flet build apk

      - name: Zmień nazwę na stałą
        run: find build/apk -name "*.apk" -exec mv {} MasterADHD.apk \;

      - name: Udostępnij w GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest MasterADHD.apk -t "Najnowsza Wersja" -n "Paczka stworzona automatycznie z GitHuba."