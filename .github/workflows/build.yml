name: Zbuduj i Opublikuj APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Instalacja Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalacja Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalacja bibliotek
        run: |
          pip install flet==1.0.4 pytest

      # Numer wersji (versionName/versionCode) musi rosnąć, inaczej Android
      # odmawia instalacji nowego APK na urządzeniu z poprzednią wersją.
      - name: Odczytaj wersję aplikacji
        id: app_version
        run: |
          VERSION=$(tr -d '[:space:]' < version.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=1$(echo "$VERSION" | tr -d '.')" >> "$GITHUB_OUTPUT"
          echo "Buduję Master ADHD v$VERSION"

      - name: Uruchom testy (pytest)
        run: pytest test_app.py -v

      # Wyczyść cache Gradle przed budowaniem (unikamy korupcji plików NDK)
      - name: Wyczyść cache Gradle
        run: |
          rm -rf ~/.gradle/caches/

      - name: Budowanie APK (64-bit)
        run: |
          yes | flet build apk --arch arm64-v8a --project "MasterADHD" --no-default-excludes \
            --build-version "${{ steps.app_version.outputs.version }}" \
            --build-number "${{ steps.app_version.outputs.code }}"

      - name: Zmień nazwę na stałą
        run: find build/apk -name "*.apk" -exec mv {} MasterADHD.apk \;

      - name: Udostępnij w GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest MasterADHD.apk -t "Najnowsza Wersja" -n "Paczka z ikoną z folderu assets i silnikiem OTA."